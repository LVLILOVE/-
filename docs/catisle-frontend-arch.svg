<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="680" height="500" fill="#F7F2EA"/>
<title>猫屿 CAT ISLE 前台系统架构（模块图）</title>
<desc>前台系统分为页面层、公共组件层与数据支撑层三层</desc>

<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#6B4F3F" letter-spacing="2">前台系统架构（模块图）</text>

<g>
<rect x="40" y="46" width="600" height="212" rx="14" fill="none" stroke="#C89F7B" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="64" font-size="12" fill="#A97B50" letter-spacing="1">页面层 · 前台 7 页</text>

<rect x="44" y="76" width="592" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="340" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6B4F3F">首页 · 单页长滚动（Hero / 品牌故事 / 猫咪预览 / 餐单预览 / 安全须知 / 门店）</text>

<rect x="44" y="126" width="192" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="140" y="151" text-anchor="middle" font-size="12.5" fill="#6B4F3F">猫咪列表 /cats</text>
<rect x="264" y="126" width="192" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="360" y="151" text-anchor="middle" font-size="12.5" fill="#6B4F3F">猫咪详情 /cats/:id</text>
<rect x="484" y="126" width="152" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="560" y="151" text-anchor="middle" font-size="12.5" fill="#6B4F3F">餐单 /menu</text>

<rect x="44" y="176" width="192" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="140" y="201" text-anchor="middle" font-size="12.5" fill="#6B4F3F">预约 /reserve</text>
<rect x="264" y="176" width="192" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="360" y="201" text-anchor="middle" font-size="12.5" fill="#6B4F3F">领养 /adopt</text>
<rect x="484" y="176" width="152" height="40" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="560" y="201" text-anchor="middle" font-size="12.5" fill="#6B4F3F">隐私 /privacy</text>
</g>

<g>
<rect x="40" y="272" width="600" height="118" rx="14" fill="none" stroke="#C89F7B" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="290" font-size="12" fill="#A97B50" letter-spacing="1">公共组件层（全站复用，对齐 UI/UX 文档 §3）</text>

<rect x="44" y="300" width="192" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="140" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">吸顶导航（毛玻璃/汉堡）</text>
<rect x="264" y="300" width="192" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="360" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">页脚 / 悬浮横幅</text>
<rect x="484" y="300" width="152" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="560" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">移动端底部预约栏</text>

<rect x="44" y="348" width="192" height="36" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="140" y="371" text-anchor="middle" font-size="12" fill="#6B4F3F">卡片组件（猫/菜单/安全）</text>
<rect x="264" y="348" width="192" height="36" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="360" y="371" text-anchor="middle" font-size="12" fill="#6B4F3F">表单组件（onBlur 校验）</text>
<rect x="484" y="348" width="152" height="36" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="560" y="371" text-anchor="middle" font-size="12" fill="#6B4F3F">预约/领养流程视图</text>
</g>

<g>
<rect x="40" y="404" width="600" height="76" rx="14" fill="none" stroke="#C89F7B" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="422" font-size="12" fill="#A97B50" letter-spacing="1">数据支撑层</text>

<rect x="44" y="432" width="250" height="40" rx="10" fill="#633806" stroke="#EF9F27" stroke-width="1"/>
<text x="169" y="457" text-anchor="middle" font-size="12.5" font-weight="500" fill="#FAC775">axios 封装（解包 {code,msg,data}）</text>
<rect x="390" y="432" width="250" height="40" rx="10" fill="#633806" stroke="#EF9F27" stroke-width="1"/>
<text x="515" y="457" text-anchor="middle" font-size="12.5" font-weight="500" fill="#FAC775">FastAPI 公开接口 /api/*</text>
<line x1="296" y1="452" x2="386" y2="452" stroke="#A97B50" stroke-width="1.5" marker-end="url(#farr)"/>
</g>

<defs>
<marker id="farr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A97B50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="472" width="12" height="12" rx="3" fill="#FAECE7" stroke="#F0997B" stroke-width="0.8"/>
<text x="58" y="482" font-size="11" fill="#8A6F5C">页面</text>
<rect x="120" y="472" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#EADFCF" stroke-width="0.8"/>
<text x="138" y="482" font-size="11" fill="#8A6F5C">公共组件</text>
<rect x="230" y="472" width="12" height="12" rx="3" fill="#633806" stroke="#EF9F27" stroke-width="0.8"/>
<text x="248" y="482" font-size="11" fill="#8A6F5C">数据层</text>
</svg>
