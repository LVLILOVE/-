<g stroke="#A97B50" stroke-width="1.2" fill="none">
<path d="M278 202 C278 214, 140 214, 140 226" marker-start="url(#one)" marker-end="url(#crow)"/>
<path d="M176 296 L208 296" marker-start="url(#one)" marker-end="url(#crow)"/>
</g>
<rect x="180" y="214" width="62" height="16" rx="8" fill="#F7F2EA"/>
<text x="211" y="225" text-anchor="middle" font-size="11" fill="#A97B50">意向猫 1—*</text>
<rect x="212" y="286" width="62" height="16" rx="8" fill="#F7F2EA"/>
<text x="243" y="297" text-anchor="middle" font-size="11" fill="#A97B50">回访 1—*</text>

<text x="340" y="402" text-anchor="middle" font-size="11" fill="#8A6F5C">仅 cats→adoptions（意向猫）与 adoptions→adoption_notes（回访）存在外键，其余为独立表</text>
