<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="680" height="420" fill="#F7F2EA"/>
<title>猫屿 CAT ISLE 数据库 ER 图</title>
<desc>八张表的实体关系图：猫咪档案、领养申请与回访记录存在外键关系</desc>

<text x="340" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#6B4F3F" letter-spacing="2">猫屿数据库 ER 图</text>

