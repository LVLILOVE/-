</marker>
<marker id="one" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M1 2 L1 8" fill="none" stroke="#A97B50" stroke-width="1.2"/>
