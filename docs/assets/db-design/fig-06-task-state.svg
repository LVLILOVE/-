<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#5F5E5A"/>
    </marker>
    <marker id="arwRed" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#A63A2E"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#FFFFFF"/>

  <text x="450" y="36" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#0C447C" text-anchor="middle">tasks 表状态机</text>
  <text x="450" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12.5" fill="#5F5E5A" text-anchor="middle">status 列取值受 CHECK 约束限定为 4 种 · 失败后不原地重试，而是新建任务</text>

  <!-- created -->
  <rect x="66" y="140" width="150" height="58" rx="9" fill="#F6FAFE" stroke="#185FA5" stroke-width="1.6"/>
  <text x="141" y="164" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">created</text>
  <text x="141" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle">已创建，未开始</text>

  <!-- running -->
  <rect x="330" y="140" width="150" height="58" rx="9" fill="#F6FAFE" stroke="#185FA5" stroke-width="1.6"/>
  <text x="405" y="164" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">running</text>
  <text x="405" y="184" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle">推理中，写 started_at</text>

  <!-- succeeded -->
  <rect x="672" y="76" width="160" height="58" rx="9" fill="#EAF6EE" stroke="#2E7D4F" stroke-width="1.6"/>
  <text x="752" y="100" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#1F5C38" text-anchor="middle">succeeded</text>
  <text x="752" y="120" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#3F6B51" text-anchor="middle">写 finished_at + 指标</text>

  <!-- failed -->
  <rect x="672" y="202" width="160" height="58" rx="9" fill="#FBEDEA" stroke="#A63A2E" stroke-width="1.6"/>
  <text x="752" y="226" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#8A2F24" text-anchor="middle">failed</text>
  <text x="752" y="246" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#8A2F24" text-anchor="middle">写 error_code / 软失败阶段</text>

  <!-- created -> running -->
  <path d="M216,169 L322,169" stroke="#5F5E5A" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="269" y="160" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle">POST /predictions</text>
  <text x="269" y="190" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#5F5E5A" text-anchor="middle">后台启动推理</text>

  <!-- running -> succeeded -->
  <path d="M480,158 L664,113" stroke="#2E7D4F" stroke-width="1.6" fill="none" marker-end="url(#arw)"/>
  <text x="570" y="122" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#1F5C38" text-anchor="middle">推理完成且写库成功</text>

  <!-- running -> failed -->
  <path d="M480,180 L664,222" stroke="#A63A2E" stroke-width="1.6" fill="none" marker-end="url(#arwRed)"/>
  <text x="572" y="216" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#8A2F24" text-anchor="middle">E_TIMEOUT / E_INFER_FAIL</text>
  <text x="572" y="234" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#8A2F24" text-anchor="middle">E_TOO_MANY_SERIES</text>

  <!-- 说明条 -->
  <rect x="66" y="258" width="766" height="50" rx="8" fill="#F4F4F2" stroke="#D6D5CF" stroke-width="1"/>
  <text x="449" y="278" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#3F3E3A" text-anchor="middle">failed 不影响 is_deleted：失败任务照常出现在历史列表（FR-HIS-01），便于用户查看失败原因并重新发起</text>
  <text x="449" y="297" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11.5" fill="#3F3E3A" text-anchor="middle">软失败（部分序列不可预测）不算 failed：status=succeeded，由 l3_count &gt; 0 在前端披露</text>
</svg>
