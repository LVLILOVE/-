# ============================================================
# 代码段功能：Nginx 部署配置（单机：Nginx 反代 + FastAPI:8000）
# - 将 nginx.conf 复制到 /etc/nginx/conf.d/catisle.conf 后使用
# - HTTPS 推荐使用 certbot 自动签发（见文件末尾说明）
# ============================================================

# HTTP 入口：强制跳转 HTTPS（上线时启用）
server {
    listen 80;
    server_name catisle.example.com;   # ← 替换为已备案域名

    # 未配置证书前，先放开以下行做 HTTP 验收；配好证书后改为 return 301
    # return 301 https://$host$request_uri;

    # ===== 前端静态资源（构建产物，含 hash 文件名 → 长缓存）=====
    location /assets/ {
        alias /opt/catisle/static/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 后端 API 反代 =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传限制：与后端 MAX_UPLOAD_MB 对齐（默认 5MB，图片压缩后一般 <300KB）
        client_max_body_size 6m;
    }

    # ===== 上传图片（uploads 目录，7 天缓存）=====
    location /uploads/ {
        alias /opt/catisle/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ===== SPA 路由回退：其余路径交给 FastAPI（由后端返回 index.html）=====
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ============================================================
# HTTPS（正式上线启用）
# 1. 安装 certbot：sudo apt install certbot python3-certbot-nginx
# 2. 签发证书：sudo certbot --nginx -d catisle.example.com
# 3. certbot 自动改写本文件为 443 server 并配置证书与跳转
# 4. 定时续期：certbot renew（系统自带 cron，无需手动）
# ============================================================

# ============================================================
# Gzip 压缩（可选，对 API 与静态文本启用）
# 放入 http{} 或 server{} 均可
# ============================================================
# gzip on;
# gzip_types text/plain text/css application/javascript application/json image/svg+xml;
# gzip_min_length 1k;
