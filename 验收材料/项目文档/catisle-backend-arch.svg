<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
<rect x="0" y="0" width="680" height="500" fill="#F7F2EA"/>
<title>猫屿 CAT ISLE 后台系统架构（模块图）</title>
<desc>后台系统分为功能模块层、通用组件层与基础设施层三层</desc>

<text x="340" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#6B4F3F" letter-spacing="2">后台系统架构（模块图）</text>

<g>
<rect x="40" y="46" width="600" height="212" rx="14" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="64" font-size="12" fill="#185FA5" letter-spacing="1">功能模块层 · 后台 8 模块（仅店主 1 账号）</text>

<rect x="44" y="76" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="114" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0C447C">登录</text>
<rect x="200" y="76" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="270" y="101" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0C447C">仪表盘统计</text>
<rect x="356" y="76" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="426" y="101" text-anchor="middle" font-size="12.5" fill="#0C447C">猫咪管理</text>
<rect x="512" y="76" width="128" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="576" y="101" text-anchor="middle" font-size="12.5" fill="#0C447C">餐单管理</text>

<rect x="44" y="126" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="114" y="151" text-anchor="middle" font-size="12.5" fill="#0C447C">预约管理</text>
<rect x="200" y="126" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="270" y="151" text-anchor="middle" font-size="12.5" fill="#0C447C">领养管理</text>
<rect x="356" y="126" width="140" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="426" y="151" text-anchor="middle" font-size="12.5" fill="#0C447C">门店设置</text>
<rect x="512" y="126" width="128" height="40" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="576" y="151" text-anchor="middle" font-size="12.5" fill="#0C447C">时段设置</text>

<rect x="44" y="176" width="592" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="340" y="201" text-anchor="middle" font-size="12" fill="#6B4F3F">核心业务：预约押金核验（通过/退回） · 领养审核流转（待审核→面谈→家访→已领养/未通过） · 回访记录 · 时段余量总览</text>
<rect x="44" y="224" width="592" height="26" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8"/>
<text x="340" y="241" text-anchor="middle" font-size="11.5" fill="#854F0B">说明：预约/领养管理为业务核心，含状态机流转与押金/退款记录</text>
</g>

<g>
<rect x="40" y="272" width="600" height="118" rx="14" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="290" font-size="12" fill="#185FA5" letter-spacing="1">通用组件层（后台复用）</text>

<rect x="44" y="300" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="114" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">数据表格（筛选/分页）</text>
<rect x="200" y="300" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="270" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">表单与校验</text>
<rect x="356" y="300" width="140" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="426" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">图片上传（压缩）</text>
<rect x="512" y="300" width="128" height="40" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="576" y="325" text-anchor="middle" font-size="12" fill="#6B4F3F">状态徽章/操作</text>

<rect x="44" y="348" width="592" height="36" rx="10" fill="#FFFFFF" stroke="#EADFCF" stroke-width="1"/>
<text x="340" y="371" text-anchor="middle" font-size="12" fill="#6B4F3F">路由守卫：无 JWT 一律重定向 /admin/login；axios 拦截 401 统一处理</text>
</g>

<g>
<rect x="40" y="404" width="600" height="76" rx="14" fill="none" stroke="#185FA5" stroke-width="1" stroke-dasharray="5 4"/>
<text x="56" y="422" font-size="12" fill="#185FA5" letter-spacing="1">基础设施层</text>

<rect x="44" y="432" width="250" height="40" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="169" y="457" text-anchor="middle" font-size="12.5" font-weight="500" fill="#B5D4F4">JWT 鉴权（bcrypt + HS256）</text>
<rect x="390" y="432" width="250" height="40" rx="10" fill="#0C447C" stroke="#85B7EB" stroke-width="1"/>
<text x="515" y="457" text-anchor="middle" font-size="12.5" font-weight="500" fill="#B5D4F4">FastAPI 后台接口 /api/admin/*</text>
<line x1="296" y1="452" x2="386" y2="452" stroke="#185FA5" stroke-width="1.5" marker-end="url(#barr)"/>
</g>

<defs>
<marker id="barr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="472" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>
<text x="58" y="482" font-size="11" fill="#8A6F5C">功能模块</text>
<rect x="140" y="472" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#EADFCF" stroke-width="0.8"/>
<text x="158" y="482" font-size="11" fill="#8A6F5C">通用组件</text>
<rect x="250" y="472" width="12" height="12" rx="3" fill="#0C447C" stroke="#85B7EB" stroke-width="0.8"/>
<text x="268" y="482" font-size="11" fill="#8A6F5C">基础设施</text>
</svg>
