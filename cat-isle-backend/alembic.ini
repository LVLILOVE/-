# Alembic 配置（数据库设计文档 §6）
# 用法：alembic revision --autogenerate -m "xxx"  →  alembic upgrade head
# 注意：--autogenerate 无法捕获 CHECK 约束与部分唯一索引（WHERE 条件），
#       必须在迁移文件中手工核对/补充（对齐数据库设计文档 §4）。

[alembic]
script_location = alembic
prepend_sys_path = .
# 实际连接串在 alembic/env.py 中从 app.core.config 读取（避免明文）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
